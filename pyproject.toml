[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plumetools"
version = "0.1.0"
description = "Analytical plume source-flow inflow generation for dsmcFoam cases"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andy Torres" }]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",   # integrate.trapezoid was added in 1.6
    "pyyaml>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Post-processing only. paraview.simple ships with ParaView and is not pip-installable;
# see docs/environment.md.
plots = ["matplotlib>=3.4", "pandas>=1.2"]
# Slice imagery (plumetools/viz). VifPara drives ParaView, which must already be
# installed -- 5.11 to 5.13, and its internal Python must match this
# interpreter's minor version. See docs/viz-slices.md.
#
# WARNING: vifpara 1.3.4 pins numpy==1.26.4 exactly, so installing this extra
# DOWNGRADES numpy (and with it scipy) in the environment. The test suite passes
# either way -- 956 tests, verified on numpy 1.26.4 -- but the pin is why this is
# an extra and not a core dependency.
viz = ["vifpara>=1.3,<2"]
# Case generation. cases/markelov1999/generate_cases.py REQUIRES CaseFoam
# (https://github.com/DLR-RY/caseFOAM) -- there is no built-in substitute. It is
# an extra rather than a core dependency only because it pulls in PyFoam and
# pandas, which the library itself does not need. Verified against casefoam 0.2.0.
cases = ["casefoam>=0.2"]

[tool.setuptools.packages.find]
include = ["plumetools*"]

# plumetools/viz/slices.yaml is the default sampling configuration and is loaded
# at runtime, so it has to ship with the package rather than only exist in the
# source tree.
[tool.setuptools.package-data]
plumetools = ["viz/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_openfoam: requires a working OpenFOAM + dsmcFoam environment, and libplumeDsmcBoundaryModels.so (deselect with -m 'not needs_openfoam')",
]
