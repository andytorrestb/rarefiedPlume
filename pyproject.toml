[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plumetools"
version = "0.1.0"
description = "Analytical plume source-flow inflow generation for dsmcFoam+ cases"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andy Torres" }]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",   # integrate.trapezoid was added in 1.6
    "pyyaml>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Post-processing only. paraview.simple ships with ParaView and is not pip-installable;
# see docs/environment.md.
plots = ["matplotlib>=3.4", "pandas>=1.2"]
# Case generation. Optional: cases/markelov1999/generate_cases.py uses CaseFoam to
# clone the base case when it is importable, and an equivalent built-in copy when
# it is not. The two produce the same tree -- tests/unit/test_markelov_study.py
# generates both and compares them file by file -- so this is a convenience, not a
# requirement. Verified against casefoam 0.2.0.
cases = ["casefoam>=0.2"]

[tool.setuptools.packages.find]
include = ["plumetools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_openfoam: requires a working OpenFOAM + dsmcFoam+ environment (deselect with -m 'not needs_openfoam')",
]
