# The rarefaction and mesh-resolution diagnostics' settings for this case.
#
# The nozzle-plume family's `diagnostics:` section (docs/rarefaction-
# diagnostics.md), in a file of its own because the cai2012 case.yaml schema
# rejects sections it does not know. ./Alldiagnose.py reads it; the gas, the
# mean-free-path convention and D (for KnD) come from case.yaml, never from here.
#
# Copied into every case by ../generate_cases.py, like the scripts. Edit it HERE
# and run ../generate_cases.py --refresh.
#
# Every value is the nozzle-plume default except where marked [THIS FAMILY].

diagnostics:
  enabled: true

  # A cell's diagnostics are trusted with MORE than this many sampled parcels.
  # per_step counts the parcels in the cell at a step (dsmcRhoNMean) -- what
  # "parcels per cell" means everywhere else in this repository. At the 40-
  # parcel exit cell this is met at the exit and not far downstream; the summary
  # says where, under validity.invalid_by_reason.
  min_sampled_particles: 20
  particle_count_basis: per_step

  # The usual DSMC guidance, Delta <= lambda / 3: mfpResolved and the
  # resolution statistics use it. Stricter than Cai's dx/lambda0 = 1, which the
  # pre-run feasibility applies; the two are reported side by side.
  cells_per_mean_free_path: 3.0

  # [THIS FAMILY] 10 mm is also the template's geometric cap,
  # mesh.max_core_cell_over_D * D = 0.05 * 0.2 m: the finest core the Kn >= 1
  # meshes get without the collision criterion asking. The nozzle-plume default
  # happens to be the same number.
  practical_min_cell_size_m: 0.010

  # [THIS FAMILY] mesh.max_cells of baseCase/case.yaml, so "within budget" here
  # and "mesh_budget" in the pre-run feasibility mean the same budget. The
  # nozzle-plume default is 10 000 000.
  mesh_budget_cells: 4000000

  # KnD = lambda / D is added from case.yaml's nozzle diameter; add others here.
  reference_lengths_m: {}

  select: null
  field_names: {}
  invalid_value: -1.0
