# The Cai & Wang 2012 KNUDSEN EXTENSION: four new Kn at the baseline weight.
#
# Cai, C., and Wang, L., "Numerical Validations for a Set of Collisionless Rocket
# Plume Solutions", Journal of Spacecraft and Rockets, Vol. 49, No. 1, 2012.
#
# Generate with:
#     ./generate_cases.py              all four, idempotently
#     ./generate_cases.py --dry-run    what it would do, and the feasibility
#
# THIS FILE IS IN cases/cai2012's OWN study.yaml SCHEMA and is read by that
# family's loader, plumetools.cai2012.study.load_study -- the same kn_cases,
# particle_levels and multipliers, with the same meaning. What this family adds
# is enforced in code (plumetools/cai2012ext/policy.py) rather than written as
# new keys here, because the parent loader rejects unknown keys:
#
#   * EXACTLY Kn = 1e-4, 1e-3, 1, 10, each at the baseline parcel level only:
#     four configurations. Generation refuses any other enabled combination,
#     a second particle level included.
#
#   * Kn = 0.01, 0.1 and 100 -- Cai's own conditions -- are EXCLUDED. An entry
#     at one of them is refused EVEN IF IT IS DISABLED, every All*Cases script
#     refuses a manifest that lists one, and a case's runCase.sh / runMesh.sh
#     refuse a case at one. They belong to cases/cai2012.
#
#   * run_time_multiplier and output_frequency_multiplier must be 1. The parent
#     study runs at 3 and 4; inherited, they would silently multiply the
#     averaging window and the write cadence.
#
#   * per-Kn `overrides` may touch only the mesh section and dsmc.courant_target
#     / delta_t_s / n_subdomains. D, S0, T0, the gas, the startup, the
#     averaging and the estimators are held fixed across all four.
#
# Separate output: Cases/ and manifest.yaml beside this file, nothing shared
# with cases/cai2012 or cases/cai2012-health.

base_case: baseCase
cases_dir: Cases
manifest_name: manifest.yaml

# --- the particle level: the baseline only -----------------------------------
#
# ONE level. There is no parcel-population sweep in this study: every case runs
# at the baseline weight
#
#     nEquivalentParticles = n0 * V_exit / 40
#
# derived per case from its own n0 and exit cell volume -- 40 parcels in the
# exit cell, cases/cai2012-health's ppc040 row, its highest-resolution weight
# (not the parent study's 20). How well that weight samples each case is
# measured from the run itself: Allaudit.py (parcels per cell by region),
# Alldiagnose.py (parcelsPerStep, diagValid) and Allconverge.py.
#
# The entry is kept, rather than left out, because cases/cai2012's loader names
# a case by its level: the directories are <KnCase>_np1x, as in that family.
# generate_cases.py refuses a second level.
particle_levels:
  - name: np1x
    multiplier: 1.0
    enabled: true
    note: >-
      THE BASELINE, and the only level: 40 parcels in the exit cell, the
      cai2012-health ppc040 occupancy.

# --- run length and write frequency ------------------------------------------
#
# BOTH 1. The averaging window is dsmc.sampling_domain_transits = 4.5 transits
# after the startup, and the write cadence is the health family's 3.536e-4 s;
# neither is scaled. (cases/cai2012/study.yaml uses 3.0 and 4.0 -- do not copy.)
run_time_multiplier: 1.0
output_frequency_multiplier: 1.0

# --- the physical matrix -----------------------------------------------------
#
# [EXTENSION] four Knudsen numbers on the nozzle DIAMETER, none of them Cai's.
# Generated most rarefied first, as in the parent study.
#
# Startup is Cai's 10^4 reference collision times (baseCase/case.yaml,
# dsmc.transient_basis: cai), the reference being the Kn = 0.01 exit state for
# every case: 0.0501 s, 17.7 domain transits. No override below changes it.
kn_cases:
  - name: Kn10
    Kn: 10.0
    enabled: true
    note: >-
      lambda0 = 2 m, ten domain lengths: near-collisionless, between Cai's
      Kn = 100 and 0.1. The 10 mm geometric cap sets the mesh (1,310,720 cells,
      the cai2012-health mesh), cell/lambda0 = 0.005.

  - name: Kn1
    Kn: 1.0
    enabled: true
    note: >-
      lambda0 = 0.2 m = D. Same mesh as Kn10, cell/lambda0 = 0.05. The first
      case where collisions in the near plume should be visible against the
      collisionless solution.

  - name: Kn0p001
    Kn: 0.001
    enabled: true
    note: >-
      lambda0 = 0.2 mm. Resolving it needs ~2e10 cells; within mesh.max_cells
      the core is coarsened to ~5.2 mm, cell/lambda0 ~ 26, and the time step is
      ~1.4 exit collision times. UNSUITABLE FOR PRODUCTION as configured: the
      manifest says so, and its runCase.sh runs it marked NON-PRODUCTION. Its
      configuration is kept as the record of what was asked for.

  - name: Kn0p0001
    Kn: 0.0001
    enabled: true
    note: >-
      lambda0 = 20 um, essentially continuum at the exit. Resolving it needs
      ~2e13 cells; within mesh.max_cells the core is ~5.4 mm, cell/lambda0 ~ 270
      and deltaT ~ 15 exit collision times. UNSUITABLE FOR PRODUCTION as
      configured, for the same reasons, by a wider margin.

meta:
  reference: Cai and Wang 2012
  study: Knudsen extension -- NOT one of Cai's cases
  gas: Ar
  nozzle_diameter_m: 0.2
  speed_ratio: 2.0
  exit_temperature_K: 300.0
  collision_model: VHS
  collision_selection: NTC
  solver: standard OpenFOAM v2512 dsmcFoam
  numerical_settings_from: >-
    cases/cai2012-health, highest-resolution combination ppc040/s4p5
    (40 parcels per exit cell, 4.5 transits of averaging, 3.536e-4 s writes,
    Courant 0.2, the same mesh planning and checks), with Cai's 10^4 t0
    startup in place of health's 2 transits.
  note: >-
    There are no published DSMC results at these Knudsen numbers. Every
    comparison this family makes is against Cai's collisionless ANALYTICAL
    solution (plumetools.cai2012.analytical); Cai's reported centreline errors
    at 100 / 0.1 / 0.01 are not tolerances for these cases and are never
    applied to them.
