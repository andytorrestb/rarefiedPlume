# cases/plate-unigas/baseCase -- Cai's thruster firing normal onto a plate.
#
# THE TEMPLATE every case of this family is generated from (generate_cases.py).
# nozzleplume's case.yaml schema; the uniGasFoam settings live beside it in
# unigas.yaml. Per case the generator writes exit.knudsen, plate.standoff_m,
# domain.x_max_m, mesh.refinement_regions and meta. Do not hand-edit a
# generated case: edit this template or study.yaml and regenerate.
#
# Design: docs/superpowers/specs/2026-11-24-plate-impingement-kn-sweep-unigasfoam-design.md
#
# Tags: [FIRST] as cases/cai2012-unigas, unchanged; [OWNER] decided by the
# owner; [CALL] the design's call, overturnable; [DERIVED] by the generator.

model: nozzle_exit_plume
execution_profile: production

meta:
  study: Plate-impingement Kn sweep on uniGasFoam hybrid USP-DSMC
  solver: uniGasFoam hybrid USP-DSMC
  unigas_branch: dsmc-time-step-limit
  unigas_commit: bd8ba5c3d9ffbbf95a30629eae7012b913188f4a
  # the generator adds case_name, kn_case, knudsen, standoff_over_D

# --- the nozzle exit: Cai's thruster ------------------------------------------
nozzle:
  exit_diameter_m: 0.2               # [FIRST] D

exit:
  temperature_K: 300.0               # [FIRST] T0
  speed_ratio: 2.0                   # [FIRST] S0 = U0 / sqrt(2 R T0)
  knudsen: 100.0                     # [OWNER][SWEPT] written per case

# --- the gas: the first family's VHS argon -------------------------------------
gas:
  species_name: Ar
  molecular_mass_kg: 6.63e-26        # [FIRST]
  molecular_diameter_m: 4.17e-10     # [FIRST]
  omega: 0.74                        # [FIRST]
  t_ref_K: 273.0                     # [FIRST]
  internal_degrees_of_freedom: 0
  mean_free_path_convention: vhs

# --- the plate: r-4d's panel, centred, normal to the plume --------------------
plate:
  standoff_m: 5.0                    # [OWNER][SWEPT] z/D x D, written per case
  thickness_m: 0.25                  # [OWNER]
  size_y_m: 34.14                    # [OWNER]
  size_z_m: 11.88                    # [OWNER] r-4d's 11.88 m
  centre_y_m: 0.0                    # [CALL] aimed at the centre
  centre_z_m: 0.0
  temperature_K: 300.0               # [CALL] fully diffuse at 300 K

# --- the domain: one quarter ---------------------------------------------------
# r-4d's margins: 1.75 m behind the plate, ~2 m beyond its edges. Rounded up to
# whole background cells by nozzleplume.
domain:
  x_max_m: 7.0                       # [DERIVED] standoff + 0.25 + 1.75
  y_half_m: 19.07                    # 17.07 + 2
  z_half_m: 7.94                     # 5.94 + 2
  symmetry_planes: [y, z]            # [CALL] a quarter: the plate is centred

# --- the mesh: sized by the local mean free path ------------------------------
# cell = clamp(min(lambda0 n0/n, r/20), 10 mm, 0.64 m) from Cai's collisionless
# density, turned into cones per octree level by plumetools.plateugf.sizing.
mesh:
  background_cell_size_m: 0.64       # [CALL] levels 0.32 ... 0.01 m (level 6)
  plate_refinement_level: 3          # [CALL] 0.08 m: three cells through the plate
  refinement_regions: []             # [DERIVED] written per case
  n_cells_between_levels: 2          # [CALL]
  max_cells: 1000000000              # [OWNER] no budget: a typo guard only

# --- the run ------------------------------------------------------------------
# nozzleplume's run window (transits of x_max at U0); the solver is uniGasFoam,
# so only the weight, the window, the initial fill and the decomposition below
# are used -- the dsmcFoam model names are ignored.
dsmc:
  n_equivalent_particles: null       # [CALL] derived: 40 parcels in the exit cell
  target_particles_per_exit_cell: 40.0
  courant_target: 0.2                # the INITIAL step; uniGasFoam adapts it
  transient_domain_transits: 6.0     # [CALL] r-4d's startup
  sampling_domain_transits: 3.0      # [CALL] r-4d's averaging
  initial_number_density_per_m3: 1.0e+10   # [FIRST] near-vacuum start
  initial_temperature_K: 300.0
  n_subdomains: 192                  # one cluster node
  decomposition_method: scotch       # [CALL] the octree makes simple slabs uneven

checks:
  min_particles_per_cell: 5.0
  min_nozzle_faces: 12
  max_nozzle_area_error: 0.05
  warn_parcels: 1.0e+9               # no budget: warn only far beyond any plan
