# cases/plate-unigas -- the 21-case plate-impingement Kn sweep on uniGasFoam.
#
#   python generate_cases.py --dry-run     the 21 cases, cells, parcels, memory; writes nothing
#   python generate_cases.py               Cases/<case>/ and manifest-plate.yaml
#   python generate_cases.py --smoke       Smoke/Kn100_zD25: the laptop smoke run
#
# Design: docs/superpowers/specs/2026-11-24-plate-impingement-kn-sweep-unigasfoam-design.md

base_case: baseCase
cases_dir: Cases
manifest_name: manifest-plate.yaml

# [FIRST] the first family's seven exit Knudsen numbers, on the diameter.
kn_cases:
  - {name: Kn100, Kn: 100.0}
  - {name: Kn10, Kn: 10.0}
  - {name: Kn1, Kn: 1.0}
  - {name: Kn0p1, Kn: 0.1}
  - {name: Kn0p01, Kn: 0.01}
  - {name: Kn0p001, Kn: 0.001}
  - {name: Kn0p0001, Kn: 0.0001}

# [OWNER] plate stand-off, exit plane to the plate's upstream face, in D.
standoffs_over_D: [25, 50, 100]

# The domain behind the plate (r-4d's margin); lateral margins are in the template.
margin_behind_plate_m: 1.75

# [CALL] the mean-free-path sizing rule (plumetools.plateugf.sizing).
sizing:
  floor_m: 0.01
  geo_fraction: 0.05
  max_level: 6

# The laptop smoke run (spec §8): Kn100_zD25, coarse, short, 12 ranks.
smoke:
  case: Kn100_zD25
  background_cell_size_m: 1.28
  floor_m: 0.02
  geo_fraction: 0.2
  max_level: 6
  plate_refinement_level: 4       # 0.08 m on the 1.28 m background: 3 cells through the plate
  transient_domain_transits: 1.0
  sampling_domain_transits: 1.0
  n_subdomains: 12
