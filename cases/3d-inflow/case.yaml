# cases/3d-inflow -- plume source-flow inflow model + mesh generation.
#
# Units are in every key name. See docs/source-flow-model.md for the equations and
# docs/mesh.md for the geometry.
#
# Values marked LEGACY reproduce the pre-refactor behaviour bit-for-bit and are
# annotated with the finding that explains them. Several are known to be wrong;
# they are frozen here so the extraction could be proven behaviour-preserving.
# Read docs/source-flow-model.md#open-questions before changing any of them.

model: source_flow

# --- mesh generation (plumetools/foamio/snappy.py) ----------------------------
# Measured from the committed Pointwise mesh: a 5 x 5 x 5 m box with a
# hemispherical inflow cavity of radius exactly 0.5 m at the origin, on the x = 0
# symmetry plane, opening toward +x.
#
# blockMesh builds the BACKGROUND BOX only. snappyHexMesh carves the inflow
# cavity out of it, snapping to a searchableSphere primitive. Putting the
# hemisphere in the blockMeshDict instead (mesh.type: block_mesh_ogrid) works, but
# the five-block O-grid needed radial_grading 10 to reach the far field and
# checkMesh reported max non-orthogonality 66.1 / mean 31.2 -- a property of the
# block topology, so no amount of refinement fixed it. See docs/mesh.md.
mesh:
  type: snappy_hex_sphere      # blockMesh background + snappyHexMesh cavity
  sphere_radius_m: 0.5         # must equal geometry.sphere_radius_m (validated)
  box_half_width_m: 2.5        # y, z extent -> [-2.5, 2.5]
  box_length_m: 5.0            # x extent    -> [0, 5]
  # !! PHYSICS COMPROMISE, required to run on standard dsmcFoam !!
  # 'patch' is correct -- particles should LEAVE a plume domain here. But
  # FreeStream injects on every patch-type boundary with no selection list
  # (FreeStream.C:57-62), so an outer 'patch' becomes a second inflow and the run
  # aborts with "Zero boundary temperature detected".
  # 'wall' excludes it (isType<> is an exact match) -- at the cost of an outer
  # boundary that REFLECTS instead of absorbing: the plume expands into a closed
  # box. Revert to 'patch' when using the MNF fork. See docs/solver-compatibility.md.
  outer_patch_type: wall
  patch_names: {inflow: inflow, outer: vacuum, symmetry: sym}
  # --- snappy_hex_sphere ------------------------------------------------------
  # Surface cell size = background_cell_size_m / 2**refinement_level
  #                   = 0.25 / 16 = 0.015625 m, i.e. 32 cells across the radius.
  # A coarse background with more levels is what replaces the O-grid's
  # radial_grading: cells go where the plume is dense and the near-vacuum far
  # field stays cheap.
  #
  # MEASURED (2026-08-02, checkMesh + verify_mesh): 20^3 = 8000 background cells
  # refine to 32 272 total, BELOW the O-grid's 48 000, with 5452 inflow faces
  # (Pointwise had 2044 tris). Max non-orthogonality 36.9 / mean 11.9, against
  # the O-grid's 66.1 / 31.2; max skewness 0.76 against 1.79.
  #
  # Do not push refinement_level past 4 without lowering controlDict deltaT.
  # At 1e-5 s and ~800 m/s a particle already crosses half a 0.015625 m cell per
  # step; one more level puts it over a full cell, which DSMC does not tolerate.
  background_cell_size_m: 0.25   # background box cell size; must be <= R
  refinement_level: 4            # octree levels at the sphere
  n_cells_between_levels: 2      # buffer cells per level transition
  # --- block_mesh_ogrid only (ignored by snappy_hex_sphere) -------------------
  n_tangential: 20             # -> 5 * 20^2 = 2000 inflow quads
  n_radial: 24                 # -> 5 * 20^2 * 24 = 48 000 cells
  radial_grading: 10.0         # cluster toward the sphere
  projection: searchable_sphere  # project edges AND faces; 'arc' dishes the faces

# --- inflow surface -----------------------------------------------------------
geometry:
  patch: inflow                # constant/polyMesh/sets/<patch>, else the patch's face range
  sphere_radius_m: 0.5         # CONFIRMED exact for the committed mesh; the 0.4990-0.4997
                               # spread in face centroids is faceting, not error (SM-09)
  plume_axis: [1, 0, 0]        # INFERRED from the one-sided hemisphere + revolutionAxis "x";
                               # never stated in the original code
  polar_axis: [0, 0, 1]        # LEGACY: theta = acos(z/r), measured from +z, which is NOT
                               # the plume axis (SM-04)

# --- gas ----------------------------------------------------------------------
# SM-03: the model is evaluated for N2 while the solver simulates argon.
# dsmcProperties declares typeIdList (Ar), mass 6.63e-26, rotationalDegreesOfFreedom 0
# (so gamma = 5/3), and the generated field is named boundaryNumberDensity_Ar.
# At 300 K this is v_l = 788.16 m/s instead of 558.89 m/s.
gas:
  gamma: 1.4                   # LEGACY: literal 1.4 (N2)
  molar_mass_g_per_mol: 28.0134  # LEGACY: N2; argon is 39.948
  species_name: Ar             # matches dsmcProperties typeIdList and the 0/ field suffix

# --- stagnation (chamber) conditions ------------------------------------------
stagnation:
  p0_pa: 3275009.71275         # LEGACY: the literal 475 psi hard-coded in calculateRhoN,
                               # i.e. exactly 475 * 6894.75729. Keep all digits: truncating
                               # to 3275009.71 shifts every density by 8.4e-10 relative.
                               # The original set physical_props['Po'] = 34500 (5 psi) here
                               # and then never read it (SM-01).
  T0_K: 300.0                  # used by velocity and temperature
  throat_radius_m: 0.0041275   # LEGACY: r_e = 8.255e-3 / 2. Named "exit" in the original,
                               # but f2 is the sonic density ratio, implying the throat (SM-10)

# --- angular dependence -------------------------------------------------------
angular:
  exponent_offset: 0.41        # LEGACY: the uncited 0.41 in (gamma + 0.41)/(gamma - 1) (SM-07)
  form: legacy_separable       # LEGACY: separable f(theta)*f(phi) in different planes (SM-04)
  normalization_gamma: 1.4     # LEGACY: gamma hard-coded inside calculateNormCoeff's
                               # integrand, so its `ga` argument was ignored (SM-05)
  quadrature_points: 500

# --- generated 0/ boundary conditions -----------------------------------------
# AD-03: `cylinder` and `plate` are NOT in this mesh (which has inflow/sym/vacuum),
# but the original wrote them into every field file. Preserved via
# legacy.emit_absent_patches; loading this config warns about them.
output:
  # 'standard' = OpenFOAM's own dsmcFoam (checked against v2512).
  # 'mnf'      = the micro/nano-flow fork's dsmcFoam+.
  # They read 0/boundaryT as DIFFERENT TYPES -- volScalarField vs volVectorField
  # holding (T 0 0) -- and writing the wrong one is a hard read failure.
  # Standard also has no per-face number density; see docs/solver-compatibility.md.
  dialect: standard
  patches:
    vacuum:   {type: zeroGradient}
    sym:      {type: symmetry}
    cylinder: {type: calculated, value: uniform}
    plate:    {type: calculated, value: uniform}

# --- post-processing ----------------------------------------------------------
# RP-17: the shipped system/sampleDict was copied from the archived 2d-wedge case
# and starts at r = 1.005 m -- outside this case's 0.5 m inflow surface.
sampling:
  radial_lines_deg: [0, 45, 90]
  r_start_m: 0.5
  r_end_m: 5.0
  n_points: 1000
  fields: [U_Ar, Ttra_Ar, rhoN_Ar]

# --- frozen-behaviour switches ------------------------------------------------
# Flipping any of these changes results. Do it deliberately, one per commit, and
# record the before/after inflow statistics.
legacy:
  rhoN_T0_K: 300.0             # SM-02: T0 used by density only. null = use stagnation.T0_K.
  clip_beyond_limiting_angle: false  # SM-06: false keeps the folding |cos|**n and the NaN path
  emit_absent_patches: true    # AD-03: allow cylinder/plate above
