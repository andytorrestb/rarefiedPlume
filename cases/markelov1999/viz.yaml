# cases/markelov1999/viz.yaml -- sampling settings for THIS study.
#
# THE AUTHORITATIVE LIST OF WHAT ./AllpostCases DRAWS for the AIAA 99-3455
# family. Every PNG under Cases/<gap>/<case>/results/viz/ came from an entry
# here.
#
#   ./AllpostCases                 post-process, then render this
#   ./AllpostCases --viz-only      render only
#   ./AllpostCases --viz-spec F    render something else instead
#
# Or directly, for one case:
#
#   vifpara ../../plumetools/viz/render_slices.py Cases/gap06in/p005psi \
#       --spec viz.yaml
#
# `extends: default` inherits plumetools/viz/slices.yaml -- the image size,
# colour preset, output paths and the U/Ttra derivations. Mappings merge key by
# key; the `planes` and `fields` lists below REPLACE the inherited ones
# wholesale, so what is written here is exactly what gets drawn.
#
# The companion file is cases/cai2012/viz.yaml. The two studies deliberately no
# longer share a spec: this one has SOLID BODIES in the flow and a half domain,
# and neither is true there. See docs/viz-slices.md.

version: 1
extends: default

# --- which data ---------------------------------------------------------------
sampling:
  time: latest
  prefer_mean: true        # rhoNMean where it exists.
                           #
                           # BE AWARE: this family's controlDict starts
                           # fieldAverage at timeStart 0.002, and the runs
                           # currently in Cases/ stop at 0.0015 -- BEFORE any
                           # average is written. The renderer falls back to the
                           # instantaneous fields and prints a note per field
                           # saying so, rather than drawing nothing. Those images
                           # are one timestep's parcels and the speckle in the
                           # wake is shot noise, not structure. Run further than
                           # timeStart to get averaged imagery.

# --- the centre plane ---------------------------------------------------------
# This domain is a HALF domain: mesh.y_min_m is 0.0 and y_max_m is 0.3, with the
# symmetry plane at y = 0. So y = 0 is not the middle of the mesh, it is the
# EDGE of it -- and VTK's cutter finds no cell interiors on a boundary face and
# returns an empty slice. The renderer detects that and moves the origin a
# ten-thousandth of the domain inward (3e-5 m here, far inside the first cell),
# printing a note. Do not "fix" this by writing a nudged origin below; the note
# is the record that it happened.
#
# It is the right plane regardless: the plume axis, the cylinder axis and the
# plate all lie in it.
#
# The camera looks ALONG normal, so screen-right is normal x camera_up:
# [0,1,0] x [0,0,1] = [1,0,0]. Inflow hemisphere at the left, plume to the
# right, z up.
planes:
  - name: midplane
    normal: [0, 1, 0]
    camera_up: [0, 0, 1]
    origin: [0, 0, 0]      # the symmetry plane

# --- what to draw -------------------------------------------------------------
# Unlisted keys come from plumetools/viz/catalog.py.
fields:
  - name: rhoN             # the plume, and its wake behind the cylinder
    log: true
    log_decades: 8

  - name: dsmcRhoN         # PARCEL number density -- where it thins out, every
    log: true              # other image here is noise. The wake is the thin
    log_decades: 6         # part, and the wake is what this study is about, so
                           # this one is worth reading before the others.

  - name: U                # derived in the inherited spec: momentum / rhoM
  - name: Ttra             # derived: from linearKE, momentum and rhoM

  - name: linearKE
    log: true
    log_decades: 8

  # --- surface fields ------------------------------------------------------- #
  # Boundary-only: dsmcFoam accumulates these where a molecule strikes a WALL,
  # and their internalField is uniform 0, so they cannot be sliced. This study
  # HAS walls -- bodies.cylinder and bodies.plate, both `type wall` in
  # constant/polyMesh/boundary -- so they are real here and are drawn on those
  # surfaces, viewed along the plane above. cases/cai2012 has no solid body and
  # does not ask for them at all.
  #
  # They are drawn on the wall patches ONLY. The vacuum box is a boundary too,
  # and drawing it puts an opaque slab in front of the cylinder.
  - name: q                # heat flux into a surface   [W/m^2]
  - name: fD               # force density on a surface [Pa]

# --- comparing the four reservoir pressures -----------------------------------
# Colour ranges autoscale to each case, so the 5, 25, 100 and 475 psi images each
# use a DIFFERENT scale and cannot be read side by side. To compare them, pin the
# range, e.g.
#
#   - name: q
#     range: [0.0, 5.0e+3]
#
# Left autoscaled by default: three of the four cases have not been run yet, so
# there is no measured range to pin to. See cases/markelov1999/README.md.
